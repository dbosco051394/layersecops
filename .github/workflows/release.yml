name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/layersecops

jobs:
  release:
    name: Build, push and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Major and major.minor tags for floating references
          MAJOR="${TAG%%.*}"
          MINOR="${TAG%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BAKE_DB=false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LayerSecOps ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Container image

            ```bash
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ```

            ## GitHub Action

            ```yaml
            - uses: ${{ github.repository }}@${{ steps.version.outputs.tag }}
              with:
                image-tar: image.tar
                fail-on: high
            ```

            ## Quick start

            ```bash
            layersecops scan --image-tar image.tar --format json,html,sarif,metrics --fail-on high
            ```

      - name: Update floating major-version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.version.outputs.major }}" "${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.major }}" --force
