[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layersecops"
version = "0.1.0"
description = "Scan Docker image archives for vulnerabilities with Trivy, Grype, Syft and Dive, normalized and attributed per layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LayerSecOps contributors" }]
keywords = ["docker", "security", "vulnerability", "trivy", "grype", "syft", "dive", "sbom"]
dependencies = []

[project.scripts]
layersecops = "layersecops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
